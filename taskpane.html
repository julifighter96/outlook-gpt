<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>VoiceMail AI</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      background: #fff;
      color: #111;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
    }

    button, input, textarea, select {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .header {
      padding: 12px 16px;
      padding-top: max(12px, env(safe-area-inset-top));
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .logo { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }
    .settings-btn {
      background: none; border: none; color: #999; cursor: pointer; font-size: 20px;
      min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center;
    }

    /* Tabs */
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid #e5e5e5;
      flex-shrink: 0;
    }
    .tab-btn {
      padding: 13px 10px;
      background: none;
      border: none;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: #999;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all .15s;
      min-height: 44px;
    }
    .tab-btn.active { color: #111; border-bottom-color: #111; }

    .tab-panel { display: none; flex: 1; overflow: hidden; }
    .tab-panel.active { display: flex; flex-direction: column; overflow: hidden; }

    .content {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .label {
      font-size: 11px;
      font-weight: 500;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    /* Mail card */
    .mail-card {
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      overflow: hidden;
    }
    .mail-card-header {
      background: #f7f7f7;
      padding: 10px 14px;
      border-bottom: 1px solid #e5e5e5;
    }
    .mail-from {
      font-size: 13px;
      font-weight: 600;
      color: #111;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mail-subject {
      font-size: 12px;
      color: #666;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mail-body-preview {
      padding: 10px 14px;
      font-size: 12px;
      color: #777;
      line-height: 1.55;
      max-height: 72px;
      overflow: hidden;
      white-space: pre-wrap;
      mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
    }
    .mail-empty {
      padding: 20px 14px;
      text-align: center;
      color: #bbb;
      font-size: 13px;
    }
    .reload-btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-top: 1px solid #e5e5e5;
      background: #fafafa;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: #999;
      cursor: pointer;
      transition: all .15s;
      min-height: 44px;
    }
    .reload-btn:active { background: #f0f0f0; color: #111; }
    .reload-btn:disabled { opacity: 0.4; }

    /* Style */
    .style-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .style-btn {
      border: 1px solid #e5e5e5;
      background: #fff;
      border-radius: 8px;
      color: #666;
      cursor: pointer;
      padding: 11px 4px;
      text-align: center;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      transition: all .15s;
      min-height: 44px;
    }
    .style-btn:active { border-color: #111; color: #111; }
    .style-btn.active { background: #111; border-color: #111; color: #fff; }

    /* Textareas — 16px prevents iOS auto-zoom */
    textarea {
      width: 100%;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 11px 12px;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: #111;
      resize: none;
      background: #fafafa;
      transition: border-color .15s;
    }
    textarea:focus { outline: none; border-color: #111; background: #fff; }
    textarea::placeholder { color: #bbb; }
    #hintsBox    { min-height: 60px; }
    #transcript  { min-height: 80px; }
    #resultBox   { min-height: 120px; background: #fff; }
    #resultBox2  { min-height: 120px; background: #fff; }

    /* Mic */
    .mic-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
    }
    .mic-btn {
      width: 72px; height: 72px;
      border-radius: 50%;
      border: 1.5px solid #ddd;
      background: #fff;
      cursor: pointer;
      font-size: 28px;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s;
      flex-shrink: 0;
    }
    .mic-btn:active { border-color: #111; }
    .mic-btn.recording {
      background: #111; border-color: #111;
      animation: pulse 1.4s ease-in-out infinite;
    }
    .mic-btn.sm {
      width: 44px; height: 44px;
      font-size: 18px;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(0,0,0,0.2); }
      50%       { box-shadow: 0 0 0 10px rgba(0,0,0,0); }
    }
    .mic-label { font-size: 12px; color: #999; }
    .mic-row { display: flex; align-items: center; gap: 12px; margin-top: 6px; }

    /* Main buttons */
    .main-btn {
      width: 100%;
      padding: 14px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: opacity .15s;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 50px;
      flex-shrink: 0;
    }
    .main-btn:active:not(:disabled) { opacity: 0.8; }
    .main-btn:disabled { opacity: 0.3; }

    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .result-section { display: none; }
    .result-section.visible { display: block; }

    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .action-btn {
      padding: 12px 8px;
      border: 1px solid #e5e5e5;
      background: #fff;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      color: #444;
      transition: all .15s;
      min-height: 44px;
    }
    .action-btn:active { border-color: #111; color: #111; }
    .action-btn.primary { background: #111; border-color: #111; color: #fff; }
    .action-btn.primary:active { opacity: 0.8; }

    /* Status */
    .status-bar {
      padding: 10px 16px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      border-top: 1px solid #e5e5e5;
      font-size: 12px;
      color: #999;
      display: flex; align-items: center; gap: 6px;
      flex-shrink: 0;
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #ddd; flex-shrink: 0; }
    .dot.ok    { background: #111; }
    .dot.error { background: #cc0000; }
    .dot.warn  { background: #f59e0b; }

    /* Settings */
    .settings-panel { display: none; padding: 16px; flex-direction: column; gap: 14px; overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1; }
    .settings-panel.visible { display: flex; }
    .settings-title { font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: space-between; }
    .close-btn {
      background: none; border: none; color: #999; cursor: pointer; font-size: 20px;
      min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center;
    }
    .input-label { font-size: 12px; color: #999; margin-bottom: 5px; font-weight: 500; }
    .api-input {
      width: 100%;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 11px 12px;
      font-family: monospace;
      font-size: 16px;
      color: #111;
      background: #fafafa;
    }
    .text-input {
      width: 100%;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 11px 12px;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      color: #111;
      background: #fafafa;
    }
    .text-input:focus, .api-input:focus { outline: none; border-color: #111; }
    .save-btn {
      padding: 13px; background: #111; color: #fff;
      border: none; border-radius: 8px;
      font-family: 'Inter', sans-serif; font-weight: 600; font-size: 15px; cursor: pointer;
      min-height: 50px;
    }
    .save-btn:active { opacity: 0.8; }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">VoiceMail AI</div>
  <button class="settings-btn" id="settingsToggle">⚙</button>
</div>

<!-- Settings Panel -->
<div class="settings-panel" id="settingsPanel">
  <div class="settings-title">
    Einstellungen
    <button class="close-btn" id="closeSettings">✕</button>
  </div>
  <div>
    <div class="input-label">Dein Name</div>
    <input type="text" class="text-input" id="userNameInput" placeholder="z.B. Julian Reitermann"/>
  </div>
  <div>
    <div class="input-label">OpenAI API Key</div>
    <input type="password" class="api-input" id="openaiKeyInput" placeholder="sk-..."/>
  </div>
  <div>
    <div class="input-label">Schreibstil / Zusatzanweisungen (optional)</div>
    <textarea id="customPrompt" style="min-height:72px;background:#fafafa;"
      placeholder="z.B.: Ich schreibe direkt und unkompliziert. Keine langen Floskeln."></textarea>
  </div>
  <button class="save-btn" id="saveSettings">Speichern</button>
</div>

<!-- Tabs -->
<div class="tabs" id="tabBar">
  <button class="tab-btn active" data-tab="reply">Antworten</button>
  <button class="tab-btn" data-tab="compose">Neue Mail</button>
</div>

<!-- ═══ Tab: Antworten ════════════════════════════════════════════════════════ -->
<div class="tab-panel active" id="tab-reply">
  <div class="content">

    <div>
      <div class="label">Eingegangene Mail</div>
      <div class="mail-card" id="mailCard">
        <div class="mail-empty" id="mailEmpty">Mail wird geladen...</div>
        <div id="mailLoaded" style="display:none;">
          <div class="mail-card-header">
            <div class="mail-from" id="mailFrom">–</div>
            <div class="mail-subject" id="mailSubject">–</div>
          </div>
          <div class="mail-body-preview" id="mailBodyPreview"></div>
        </div>
        <button class="reload-btn" id="reloadMailBtn">↺ Mail neu einlesen</button>
      </div>
    </div>

    <div>
      <div class="label">Stil</div>
      <div class="style-grid" id="styleGridReply">
        <button class="style-btn active" data-style="formal">Formal</button>
        <button class="style-btn" data-style="freundlich">Freundlich</button>
        <button class="style-btn" data-style="kurz">Kurz</button>
      </div>
    </div>

    <div>
      <div class="label">Hinweise (optional)</div>
      <textarea id="hintsBox" placeholder="z.B. &quot;Termin bestätigen&quot; oder &quot;höflich ablehnen und Alternativtermin vorschlagen&quot;"></textarea>
      <div class="mic-row">
        <button class="mic-btn sm" id="micBtnHints">🎙️</button>
        <span class="mic-label" id="micLabelHints">Hinweis einsprechen</span>
      </div>
    </div>

    <button class="main-btn" id="suggestBtn" disabled>Antwort vorschlagen</button>

    <div class="result-section" id="resultSection1">
      <div class="label">Vorgeschlagene Antwort</div>
      <textarea id="resultBox"></textarea>
      <div class="action-row">
        <button class="action-btn" id="regenerateBtn">↺ Neu</button>
        <button class="action-btn primary" id="insertBtn">In Antwort einfügen</button>
      </div>
    </div>

  </div>
</div>

<!-- ═══ Tab: Neue Mail ════════════════════════════════════════════════════════ -->
<div class="tab-panel" id="tab-compose">
  <div class="content">

    <div>
      <div class="label">Stil</div>
      <div class="style-grid" id="styleGridCompose">
        <button class="style-btn active" data-style="formal">Formal</button>
        <button class="style-btn" data-style="freundlich">Freundlich</button>
        <button class="style-btn" data-style="kurz">Kurz</button>
      </div>
    </div>

    <div class="mic-area">
      <button class="mic-btn" id="micBtnCompose">🎙️</button>
      <span class="mic-label" id="micLabelCompose">Klicken zum Aufnehmen</span>
    </div>

    <div>
      <div class="label">Transkript</div>
      <textarea id="transcript" placeholder="Gesprochener Text erscheint hier – oder direkt eintippen."></textarea>
    </div>

    <button class="main-btn" id="generateBtn" disabled>E-Mail formulieren</button>

    <div class="result-section" id="resultSection2">
      <div class="label">Formulierter Text</div>
      <textarea id="resultBox2"></textarea>
      <div class="action-row">
        <button class="action-btn" id="regenerateBtn2">↺ Neu</button>
        <button class="action-btn primary" id="insertBtn2">In E-Mail einfügen</button>
      </div>
    </div>

  </div>
</div>

<div class="status-bar">
  <div class="dot" id="statusDot"></div>
  <span id="statusText">Wird geladen...</span>
</div>

<script>
const $ = id => document.getElementById(id);

let mailData     = { from: '', subject: '', body: '' };
let styleReply   = 'formal';
let styleCompose = 'formal';

function setStatus(type, msg) {
  $('statusDot').className = 'dot' + (type ? ' ' + type : '');
  $('statusText').textContent = msg;
}

// ── Settings ─────────────────────────────────────────────────────────────────

function loadSettings() {
  $('userNameInput').value  = localStorage.getItem('vm_user_name') || '';
  $('openaiKeyInput').value = localStorage.getItem('vm_openai_key') || '';
  $('customPrompt').value   = localStorage.getItem('vm_custom_prompt') || '';
}
$('settingsToggle').onclick = () => {
  loadSettings();
  const open = $('settingsPanel').classList.toggle('visible');
  $('tabBar').style.display        = open ? 'none' : '';
  document.querySelectorAll('.tab-panel.active').forEach(p => p.style.display = open ? 'none' : '');
};
$('closeSettings').onclick = () => {
  $('settingsPanel').classList.remove('visible');
  $('tabBar').style.display = '';
  document.querySelectorAll('.tab-panel.active').forEach(p => p.style.display = '');
};
$('saveSettings').onclick = () => {
  localStorage.setItem('vm_user_name',     $('userNameInput').value.trim());
  localStorage.setItem('vm_openai_key',    $('openaiKeyInput').value.trim());
  localStorage.setItem('vm_custom_prompt', $('customPrompt').value.trim());
  $('closeSettings').click();
  setStatus('ok', 'Gespeichert');
};

// ── Tabs ──────────────────────────────────────────────────────────────────────

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    $('tab-' + btn.dataset.tab).classList.add('active');
  };
});

// ── Style buttons ─────────────────────────────────────────────────────────────

document.querySelectorAll('#styleGridReply .style-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('#styleGridReply .style-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    styleReply = btn.dataset.style;
  };
});
document.querySelectorAll('#styleGridCompose .style-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('#styleGridCompose .style-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    styleCompose = btn.dataset.style;
  };
});

// ── Mail einlesen ─────────────────────────────────────────────────────────────

function readCurrentMail() {
  if (typeof Office === 'undefined' || !Office.context?.mailbox?.item) {
    $('mailEmpty').textContent = 'Keine Mail geöffnet (Testmodus)';
    setStatus('warn', 'Testmodus');
    return;
  }
  $('reloadMailBtn').disabled = true;
  setStatus('warn', 'Mail wird eingelesen...');
  const item    = Office.context.mailbox.item;
  const from    = item.from?.displayName || item.from?.emailAddress || '';
  const subject = item.subject || '(kein Betreff)';

  item.body.getAsync(Office.CoercionType.Text, result => {
    $('reloadMailBtn').disabled = false;
    if (result.status === Office.AsyncResultStatus.Failed) {
      setStatus('error', 'Fehler: ' + result.error.message);
      $('mailEmpty').textContent = 'Fehler beim Einlesen der Mail.';
      return;
    }
    const body = result.value.trim();
    if (!body && !from) {
      $('mailEmpty').textContent = 'Keine Mail geöffnet oder Mail ist leer.';
      $('mailEmpty').style.display  = 'block';
      $('mailLoaded').style.display = 'none';
      setStatus('warn', 'Keine Mail gefunden');
      return;
    }
    mailData = { from, subject, body: body.slice(0, 3000) };
    $('mailFrom').textContent        = from || '(unbekannt)';
    $('mailSubject').textContent     = subject;
    $('mailBodyPreview').textContent = mailData.body;
    $('mailEmpty').style.display     = 'none';
    $('mailLoaded').style.display    = 'block';
    $('suggestBtn').disabled         = false;
    setStatus('ok', 'Bereit');
  });
}
$('reloadMailBtn').onclick = readCurrentMail;

// ── Mikrofon helper ───────────────────────────────────────────────────────────

function startRecording(micBtn, micLabel, onTranscript) {
  const key = localStorage.getItem('vm_openai_key') || '';
  if (!key) { setStatus('error', 'OpenAI API Key fehlt – bitte in ⚙ eintragen'); return; }
  const url = 'https://willowy-empanada-20d9ee.netlify.app/recorder.html#' + encodeURIComponent(key);
  micBtn.classList.add('recording'); micBtn.textContent = '⏳';
  micLabel.textContent = 'Aufnahme läuft...';
  setStatus('warn', 'Sprich im Popup-Fenster...');
  Office.context.ui.displayDialogAsync(url, { height: 35, width: 25 }, res => {
    if (res.status === Office.AsyncResultStatus.Failed) {
      setStatus('error', 'Fehler: ' + res.error.message);
      resetMic(micBtn, micLabel); return;
    }
    const dialog = res.value;
    dialog.addEventHandler(Office.EventType.DialogMessageReceived, msg => {
      dialog.close(); resetMic(micBtn, micLabel);
      try {
        const data = JSON.parse(msg.message);
        if (data.type === 'transcript' && data.text) onTranscript(data.text);
      } catch(e) { setStatus('error', 'Fehler beim Empfangen'); }
    });
    dialog.addEventHandler(Office.EventType.DialogEventReceived, () => {
      resetMic(micBtn, micLabel); setStatus('', 'Bereit');
    });
  });
}

function resetMic(btn, label) {
  btn.classList.remove('recording'); btn.textContent = '🎙️';
}

// Hints mic (reply tab)
$('micBtnHints').onclick = () => startRecording(
  $('micBtnHints'), $('micLabelHints'),
  text => {
    $('hintsBox').value = ($('hintsBox').value ? $('hintsBox').value + ' ' : '') + text;
    setStatus('ok', 'Hinweis aufgenommen');
  }
);

// Compose mic
$('micBtnCompose').onclick = () => startRecording(
  $('micBtnCompose'), $('micLabelCompose'),
  text => {
    $('transcript').value = text;
    updateComposeBtn();
    setStatus('ok', 'Transkript fertig');
  }
);

// ── Compose tab: enable button ────────────────────────────────────────────────

function updateComposeBtn() { $('generateBtn').disabled = !$('transcript').value.trim(); }
$('transcript').oninput = updateComposeBtn;

// ── OpenAI calls ──────────────────────────────────────────────────────────────

const styleLabels = {
  formal:     'formell und geschäftlich, Sie-Form, strukturiert',
  freundlich: 'freundlich-professionell, wertschätzend, klar',
  kurz:       'sehr prägnant, auf das Wesentliche reduziert'
};

async function callOpenAIReply() {
  const key      = localStorage.getItem('vm_openai_key') || '';
  const userName = localStorage.getItem('vm_user_name') || 'der Nutzer';
  const extra    = localStorage.getItem('vm_custom_prompt') || '';
  const hints    = $('hintsBox').value.trim();
  if (!key) { setStatus('error', 'OpenAI API Key fehlt – bitte in ⚙ eintragen'); return null; }

  const system = `Du bist der persönliche E-Mail-Assistent von ${userName}. \
Du liest eingehende E-Mails und formulierst eine passende Antwort, als wärst du ${userName} selbst. \
Schreibe natürlich und authentisch im Namen von ${userName}. \
Stil: ${styleLabels[styleReply]}. \
Gib nur den Nachrichtentext aus – keine Anrede, keine Grußformel, kein Markdown. Trenne Absätze mit einer Leerzeile.${extra ? '\nPersönlicher Schreibstil: ' + extra : ''}`;

  const user = `Eingehende E-Mail von ${mailData.from || 'unbekannt'}:\nBetreff: ${mailData.subject}\n\n${mailData.body}\n\n${hints ? 'Hinweise für die Antwort: ' + hints : 'Formuliere eine passende Antwort.'}`;

  return fetchGPT(system, user);
}

async function callOpenAICompose() {
  const key   = localStorage.getItem('vm_openai_key') || '';
  const extra = localStorage.getItem('vm_custom_prompt') || '';
  if (!key) { setStatus('error', 'OpenAI API Key fehlt – bitte in ⚙ eintragen'); return null; }

  const system = `Du bist ein professioneller E-Mail-Assistent für deutsche Geschäftskorrespondenz. \
Formuliere den informell eingesprochenen Text in einen professionellen E-Mail-Text um. \
Stil: ${styleLabels[styleCompose]}. \
Nur den Nachrichtentext – keine Anrede, keine Grußformel, kein Markdown. Trenne Absätze mit einer Leerzeile.${extra ? '\nZusatz: ' + extra : ''}`;

  return fetchGPT(system, $('transcript').value.trim());
}

async function fetchGPT(systemContent, userContent) {
  const key = localStorage.getItem('vm_openai_key');
  const res = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
    body: JSON.stringify({
      model: 'gpt-4o',
      max_tokens: 1024,
      messages: [
        { role: 'system', content: systemContent },
        { role: 'user',   content: userContent }
      ]
    })
  });
  if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e?.error?.message || `HTTP ${res.status}`); }
  const data = await res.json();
  return data.choices?.[0]?.message?.content || '';
}

// ── Insert into mail ──────────────────────────────────────────────────────────

function textToHtml(text) {
  return text.trim().split(/\n\n+/).map(p =>
    '<p>' + p.replace(/\n/g, '<br>') + '</p>'
  ).join('');
}

function insertIntoMail(text) {
  const html = textToHtml(text);
  if (typeof Office !== 'undefined' && Office.context?.mailbox?.item) {
    Office.context.mailbox.item.body.setAsync(html, { coercionType: Office.CoercionType.Html }, r => {
      setStatus(r.status === Office.AsyncResultStatus.Succeeded ? 'ok' : 'error',
        r.status === Office.AsyncResultStatus.Succeeded ? 'Eingefügt' : r.error.message);
    });
  } else {
    navigator.clipboard.writeText(text).then(() => setStatus('ok', 'In Zwischenablage kopiert'));
  }
}

// ── Run suggest (reply tab) ───────────────────────────────────────────────────

async function runSuggest() {
  $('suggestBtn').disabled = true;
  $('suggestBtn').innerHTML = '<div class="spinner"></div> Antwort wird formuliert...';
  $('resultSection1').classList.remove('visible');
  setStatus('warn', 'Formuliert...');
  try {
    const result = await callOpenAIReply();
    if (result) {
      $('resultBox').value = result;
      $('resultSection1').classList.add('visible');
      insertIntoMail(result);
    }
  } catch(e) {
    setStatus('error', e.message);
  } finally {
    $('suggestBtn').disabled = false;
    $('suggestBtn').textContent = 'Antwort vorschlagen';
  }
}

$('suggestBtn').onclick   = runSuggest;
$('regenerateBtn').onclick = runSuggest;
$('insertBtn').onclick    = () => insertIntoMail($('resultBox').value.trim());

// ── Run generate (compose tab) ────────────────────────────────────────────────

async function runGenerate() {
  if (!$('transcript').value.trim()) return;
  $('generateBtn').disabled = true;
  $('generateBtn').innerHTML = '<div class="spinner"></div> Formuliert...';
  $('resultSection2').classList.remove('visible');
  setStatus('warn', 'Formuliert...');
  try {
    const result = await callOpenAICompose();
    if (result) {
      $('resultBox2').value = result;
      $('resultSection2').classList.add('visible');
      insertIntoMail(result);
    }
  } catch(e) {
    setStatus('error', e.message);
  } finally {
    $('generateBtn').disabled = false;
    $('generateBtn').textContent = 'E-Mail formulieren';
    updateComposeBtn();
  }
}

$('generateBtn').onclick    = runGenerate;
$('regenerateBtn2').onclick = runGenerate;
$('insertBtn2').onclick     = () => insertIntoMail($('resultBox2').value.trim());
